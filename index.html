  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const body = document.body;
      const languageButtons = {
        en: document.querySelectorAll("#lang-en, #mobile-lang-en"),
        es: document.querySelectorAll("#lang-es, #mobile-lang-es")
      };

      function setLanguage(language) {
        body.classList.toggle("language-en", language === "en");
        body.classList.toggle("language-es", language === "es");
        document.documentElement.lang = language;

        languageButtons.en.forEach((button) => {
          button.setAttribute("aria-pressed", String(language === "en"));
        });
        languageButtons.es.forEach((button) => {
          button.setAttribute("aria-pressed", String(language === "es"));
        });
      }

      languageButtons.en.forEach((button) => button.addEventListener("click", () => setLanguage("en")));
      languageButtons.es.forEach((button) => button.addEventListener("click", () => setLanguage("es")));

      const menuButton = document.getElementById("menu-button");
      const mobileMenu = document.getElementById("mobile-menu");

      menuButton.addEventListener("click", () => {
        const willOpen = mobileMenu.classList.contains("hidden");
        mobileMenu.classList.toggle("hidden", !willOpen);
        menuButton.setAttribute("aria-expanded", String(willOpen));
      });

      document.querySelectorAll(".mobile-link").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
          menuButton.setAttribute("aria-expanded", "false");
        });
      });
    });
  </script>
